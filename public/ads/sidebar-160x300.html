<!DOCTYPE html>
<!--
  Adsterra ad slot — 160×300.
  Isolated HTML file to prevent window.atOptions collision across slots.
  Replace YOUR_AD_KEY with the actual key, or inject via the PUBLIC_AD_SIDEBAR_160X300 env var.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>body { margin: 0; padding: 0; overflow: hidden; }</style>
  </head>
  <body>
    <script type="text/javascript">
      atOptions = {
        'key': 'YOUR_AD_KEY',
        'format': 'iframe',
        'height': 300,
        'width': 160,
        'params': {}
      };
    </script>
    <script type="text/javascript" src="//www.highperformanceformat.com/YOUR_AD_KEY/invoke.js"></script>
  </body>
</html>
